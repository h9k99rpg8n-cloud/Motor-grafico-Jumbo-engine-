<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jumbo Engine • Modelado Modular</title>
  <style>
    :root {
      --bg: #020617;
      --panel: #0f172acc;
      --line: #94a3b833;
      --txt: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #8b5cf6;
      --ok: #22c55e;
      --danger: #ef4444;
      --r: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--txt); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    .app { height: 100%; display: grid; grid-template-rows: 56px 1fr 68px; }
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(10px);
    }
    .brand { font-weight: 800; letter-spacing: .2px; }
    .badge { color: var(--muted); font-size: 12px; }
    .workspace { position: relative; min-height: 0; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
    .hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
    }
    .pill {
      pointer-events: auto;
      background: #0f172ae8; border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 10px; font-size: 12px;
    }
    .panel {
      position: absolute; bottom: 76px; left: 10px; right: 10px;
      background: #020617ed; border: 1px solid var(--line); border-radius: var(--r);
      padding: 10px; max-height: 48%; overflow: auto;
      transform: translateY(120%); transition: transform .2s ease;
    }
    .panel.open { transform: translateY(0); }
    .grid { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .btn {
      border: 1px solid var(--line); background: #1e293b; color: var(--txt); border-radius: 12px;
      padding: 10px; font-weight: 700;
    }
    .btn.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; }
    .btn.ok { background: linear-gradient(135deg, #16a34a, var(--ok)); border: 0; }
    .btn.danger { background: linear-gradient(135deg, #dc2626, var(--danger)); border: 0; }
    .toolbar {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel);
    }
    .sectionTitle { margin: 6px 0; font-size: 13px; color: var(--muted); }
    .list { display: grid; gap: 6px; }
    .item {
      border: 1px solid var(--line); background: #0f172a; border-radius: 10px;
      padding: 8px 10px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;
    }
    .item.sel { border-color: var(--accent); }
    .field { display: grid; gap: 4px; margin-bottom: 8px; }
    .field label { font-size: 12px; color: var(--muted); }
    .field input[type="range"] { width: 100%; }
    @media (min-width: 880px) {
      .app { grid-template-columns: 300px 1fr; grid-template-rows: 56px 1fr; }
      .top { grid-column: 1 / -1; }
      .workspace { grid-column: 2; grid-row: 2; }
      .panel {
        grid-column: 1; grid-row: 2; position: static; transform: none; border-radius: 0; border-left: 0;
        border-top: 0; border-bottom: 0; max-height: none;
      }
      .toolbar { grid-column: 2; position: absolute; right: 10px; left: auto; bottom: 10px; width: min(520px, calc(100% - 20px)); border-radius: 12px; border: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">🧩 Jumbo Modeler</div>
      <div class="badge">Básico • Modular • Móvil</div>
    </header>

    <aside id="sidePanel" class="panel open">
      <div class="sectionTitle">Objetos</div>
      <div id="objectList" class="list"></div>

      <div class="sectionTitle">Transformar objeto seleccionado</div>
      <div class="field"><label>Posición X</label><input id="posX" type="range" min="-10" max="10" step="0.1"></div>
      <div class="field"><label>Posición Y</label><input id="posY" type="range" min="-1" max="10" step="0.1"></div>
      <div class="field"><label>Posición Z</label><input id="posZ" type="range" min="-10" max="10" step="0.1"></div>
      <div class="field"><label>Escala</label><input id="scale" type="range" min="0.2" max="3" step="0.1"></div>
      <button id="deleteBtn" class="btn danger" style="width:100%">Eliminar seleccionado</button>
    </aside>

    <section class="workspace">
      <canvas id="renderCanvas"></canvas>
      <div class="hud">
        <button id="togglePanel" class="pill">☰ Panel</button>
        <span id="selectionPill" class="pill">Sin selección</span>
      </div>
      <nav class="toolbar">
        <button id="addBox" class="btn">🧊 Caja</button>
        <button id="addSphere" class="btn">⚽ Esfera</button>
        <button id="addCylinder" class="btn">🥫 Cilindro</button>
        <button id="focusSel" class="btn ok">🎯 Enfocar</button>
        <button id="clearAll" class="btn danger">🧹 Limpiar</button>
      </nav>
    </section>
  </main>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
