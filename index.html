<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020617" />
  <title>Jumbo Engine • Modelado Modular</title>
  <style>
    :root {
      --bg: #020617;
      --panel: #0f172acc;
      --line: #94a3b833;
      --txt: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #8b5cf6;
      --ok: #22c55e;
      --danger: #ef4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --app-height: 100dvh;
      --r: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--txt); font-family: Inter, system-ui, sans-serif;
      overscroll-behavior: none;
    }
    .app {
      height: var(--app-height);
      display: grid;
      grid-template-rows: calc(56px + var(--safe-top)) 1fr calc(72px + var(--safe-bottom));
    }
    .top {
      display: flex; align-items: end; justify-content: space-between; gap: 10px;
      padding: var(--safe-top) 12px 10px;
      border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(10px);
    }
    .brand { font-weight: 800; letter-spacing: .2px; }
    .badge { color: var(--muted); font-size: 12px; }
    .workspace { position: relative; min-height: 0; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }

    .hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
    }
    .pill {
      min-height: 42px;
      pointer-events: auto;
      background: #0f172ae8; border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 12px; font-size: 12px; color: var(--txt);
    }

    .panel {
      position: absolute;
      bottom: calc(80px + var(--safe-bottom));
      left: 10px; right: 10px;
      background: #020617f0;
      border: 1px solid var(--line);
      border-radius: var(--r);
      max-height: 56%;
      overflow: auto;
      transform: translateY(120%);
      transition: transform .22s ease;
      padding: 8px 10px 12px;
      touch-action: pan-y;
    }
    .panel.open { transform: translateY(0); }
    .panelHandle {
      width: 58px; height: 5px; border-radius: 999px;
      background: #64748b;
      margin: 4px auto 8px;
    }

    .btn {
      min-height: 46px;
      border: 1px solid var(--line); background: #1e293b; color: var(--txt); border-radius: 12px;
      padding: 10px; font-weight: 700; font-size: 14px;
    }
    .btn.ok { background: linear-gradient(135deg, #16a34a, var(--ok)); border: 0; }
    .btn.danger { background: linear-gradient(135deg, #dc2626, var(--danger)); border: 0; }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 10px calc(10px + var(--safe-bottom));
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .sectionTitle { margin: 8px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; }
    .tip { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
    .list { display: grid; gap: 6px; }
    .item {
      border: 1px solid var(--line);
      background: #0f172a;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      color: var(--txt);
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .item.sel { border-color: var(--accent); }
    .field { display: grid; gap: 4px; margin-bottom: 8px; }
    .field label { font-size: 12px; color: var(--muted); }
    .field input[type="range"] { width: 100%; accent-color: var(--accent); }

    @media (min-width: 880px) {
      .app { grid-template-columns: 320px 1fr; grid-template-rows: calc(56px + var(--safe-top)) 1fr; }
      .top { grid-column: 1 / -1; }
      .workspace { grid-column: 2; grid-row: 2; }
      .panel {
        grid-column: 1; grid-row: 2;
        position: static; transform: none; border-radius: 0; border-left: 0;
        border-top: 0; border-bottom: 0; max-height: none;
      }
      .panelHandle { display: none; }
      .toolbar {
        grid-column: 2;
        position: absolute;
        right: 10px;
        left: auto;
        bottom: 10px;
        width: min(620px, calc(100% - 20px));
        border-radius: 12px;
        border: 1px solid var(--line);
        grid-template-columns: repeat(6, minmax(0, 1fr));
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">🧩 Jumbo Modeler</div>
      <div class="badge">Optimizado iOS / Android</div>
    </header>

    <aside id="sidePanel" class="panel open" aria-label="Panel de modelado">
      <div id="panelHandle" class="panelHandle"></div>
      <p class="tip">1 dedo: rotar cámara · 2 dedos: zoom/pan · toca objeto para seleccionarlo.</p>

      <div class="sectionTitle">Objetos</div>
      <div id="objectList" class="list"></div>

      <div class="sectionTitle">Transformar objeto seleccionado</div>
      <div class="field"><label>Posición X</label><input id="posX" type="range" min="-10" max="10" step="0.1"></div>
      <div class="field"><label>Posición Y</label><input id="posY" type="range" min="-1" max="10" step="0.1"></div>
      <div class="field"><label>Posición Z</label><input id="posZ" type="range" min="-10" max="10" step="0.1"></div>
      <div class="field"><label>Escala</label><input id="scale" type="range" min="0.2" max="3" step="0.1"></div>
      <button id="deleteBtn" class="btn danger" style="width:100%">Eliminar seleccionado</button>
    </aside>

    <section class="workspace" id="workspace">
      <canvas id="renderCanvas"></canvas>
      <div class="hud">
        <button id="togglePanel" class="pill">☰ Panel</button>
        <span id="selectionPill" class="pill">Sin selección</span>
      </div>
      <nav class="toolbar">
        <button id="addBox" class="btn">🧊 Caja</button>
        <button id="addSphere" class="btn">⚽ Esfera</button>
        <button id="addCylinder" class="btn">🥫 Cilindro</button>
        <button id="focusSel" class="btn ok">🎯 Enfocar</button>
        <button id="unselect" class="btn">🙅 Deseleccionar</button>
        <button id="clearAll" class="btn danger">🧹 Limpiar</button>
      </nav>
    </section>
  </main>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
