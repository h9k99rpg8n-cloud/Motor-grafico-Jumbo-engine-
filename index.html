<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jumbo Visual" />
    <meta name="theme-color" content="#000000" />

    <link rel="manifest" href="manifest.json" />
    <title>Jumbo Visual</title>

    <style>
      /* Reset mínimo para experiencia fullscreen móvil */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }

      /* Contenedor principal del motor */
      #engine-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      /* Canvas sin bordes, ocupa toda la pantalla */
      #engine-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="engine-container">
      <canvas id="engine-canvas" aria-label="Canvas del motor Jumbo Visual"></canvas>
    </div>

    <script src="engine.js"></script>
  </body>
</html>
