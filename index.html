<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>[NOMBRE DEL MOTOR] - Editor 3D Web</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --panel: #101827;
      --panel-soft: #161f31;
      --line: #27344f;
      --text: #e8eefc;
      --muted: #8fa0c3;
      --primary: #52b4ff;
      --accent: #8672ff;
      --danger: #ef5350;
      --ok: #22c55e;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 0%, #1e2d4f 0%, #0a0f1a 45%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #0c1321cc;
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      font-weight: 900;
      font-size: 12px;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(170px, 20vw) 1fr minmax(220px, 24vw);
    }

    .panel {
      min-height: 0;
      overflow: auto;
      padding: 10px;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .panel.right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .panel h2 {
      margin: 6px 0 10px;
      font-size: 13px;
      letter-spacing: .02em;
      color: #c7d5f5;
    }

    .scene-wrap {
      position: relative;
      min-width: 0;
      background: #080d17;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-top: 1px solid var(--line);
      padding: 10px;
      background: #0d1525;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn.active {
      border-color: #5fb2ff;
      background: linear-gradient(135deg, #1f3e6f, #2a2f67);
    }

    .btn.primary {
      border-color: #3b6fb4;
      background: linear-gradient(135deg, #2563eb, #6d28d9);
    }

    .btn.danger {
      border-color: #7f1d1d;
      background: linear-gradient(135deg, #7f1d1d, #b91c1c);
    }

    .obj-item {
      width: 100%;
      text-align: left;
      margin-bottom: 7px;
    }

    .obj-item.sel {
      border-color: #66bdff;
      background: #17304f;
    }

    .field {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .field label {
      grid-column: 1 / -1;
      font-size: 12px;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      background: #0d1525;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
    }

    .field.single {
      grid-template-columns: 1fr;
    }

    .status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 11px;
      color: #c1cef0;
      background: #091121cc;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 6px 9px;
      pointer-events: none;
    }

    .mobile-toggle {
      display: none;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        position: absolute;
        top: 48px;
        bottom: 58px;
        width: min(78vw, 300px);
        z-index: 12;
        transform: translateX(-105%);
        transition: transform .22s ease;
      }

      .panel.right {
        right: 0;
        transform: translateX(105%);
      }

      .panel.open {
        transform: translateX(0);
      }

      .mobile-toggle {
        display: inline-flex;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">3D</div>
        <div>[NOMBRE DEL MOTOR] <span class="pill" id="renderMode">Inicializando...</span></div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="toggleHierarchy" class="btn mobile-toggle">Jerarquía</button>
        <button id="toggleInspector" class="btn mobile-toggle">Inspector</button>
      </div>
    </header>

    <section class="layout">
      <aside id="hierarchyPanel" class="panel open">
        <h2>Jerarquía</h2>
        <div id="hierarchyList"></div>
      </aside>

      <main class="scene-wrap" id="sceneWrap">
        <div class="status" id="statusText">Sin selección</div>
      </main>

      <aside id="inspectorPanel" class="panel right open">
        <h2>Inspector</h2>
        <div class="field single">
          <label>Nombre</label>
          <input id="nameInput" type="text" placeholder="Objeto" />
        </div>
        <div class="field">
          <label>Posición</label>
          <input id="posX" type="number" step="0.1" />
          <input id="posY" type="number" step="0.1" />
          <input id="posZ" type="number" step="0.1" />
        </div>
        <div class="field">
          <label>Rotación (°)</label>
          <input id="rotX" type="number" step="1" />
          <input id="rotY" type="number" step="1" />
          <input id="rotZ" type="number" step="1" />
        </div>
        <div class="field">
          <label>Escala</label>
          <input id="sclX" type="number" step="0.1" min="0.1" />
          <input id="sclY" type="number" step="0.1" min="0.1" />
          <input id="sclZ" type="number" step="0.1" min="0.1" />
        </div>
        <div class="field single">
          <label>Color</label>
          <input id="colorInput" type="color" value="#4ea4ff" />
        </div>
      </aside>
    </section>

    <nav class="toolbar">
      <button class="btn" data-create="box">+ Cubo</button>
      <button class="btn" data-create="sphere">+ Esfera</button>
      <button class="btn" data-create="cylinder">+ Cilindro</button>
      <button class="btn" data-create="plane">+ Plano</button>
      <button class="btn active" data-mode="translate">Mover</button>
      <button class="btn" data-mode="rotate">Rotar</button>
      <button class="btn" data-mode="scale">Escalar</button>
      <button class="btn" id="duplicateBtn">Duplicar</button>
      <button class="btn danger" id="deleteBtn">Borrar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
      <button class="btn" id="loadBtn">Cargar</button>
    </nav>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.162.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.162.0/examples/jsm/controls/OrbitControls.js';
    import { TransformControls } from 'https://unpkg.com/three@0.162.0/examples/jsm/controls/TransformControls.js';

    // Renderers (WebGPU con fallback a WebGL)
    let WebGPURenderer = null;
    let webgpuAvailable = false;
    try {
      const mod = await import('https://unpkg.com/three@0.162.0/examples/jsm/renderers/webgpu/WebGPURenderer.js');
      WebGPURenderer = mod.WebGPURenderer;
      webgpuAvailable = !!navigator.gpu;
    } catch (e) {
      webgpuAvailable = false;
    }

    const STORAGE_KEY = '[NOMBRE DEL MOTOR]_project_v1';
    const sceneWrap = document.getElementById('sceneWrap');
    const hierarchyList = document.getElementById('hierarchyList');
    const renderModeLabel = document.getElementById('renderMode');
    const statusText = document.getElementById('statusText');

    // ===== Módulo: Estado =====
    const state = {
      renderer: null,
      scene: new THREE.Scene(),
      camera: null,
      orbit: null,
      transform: null,
      raycaster: new THREE.Raycaster(),
      pointer: new THREE.Vector2(),
      objects: [],
      selected: null,
      idCounter: 1
    };

    // ===== Módulo: Inicialización =====
    async function initRenderer() {
      if (webgpuAvailable && WebGPURenderer) {
        const renderer = new WebGPURenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(sceneWrap.clientWidth, sceneWrap.clientHeight);
        await renderer.init();
        renderModeLabel.textContent = 'WebGPU';
        return renderer;
      }

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(sceneWrap.clientWidth, sceneWrap.clientHeight);
      renderModeLabel.textContent = 'WebGL';
      return renderer;
    }

    async function init() {
      state.renderer = await initRenderer();
      sceneWrap.prepend(state.renderer.domElement);

      state.scene.background = new THREE.Color(0x0a0f1a);
      state.camera = new THREE.PerspectiveCamera(55, sceneWrap.clientWidth / sceneWrap.clientHeight, 0.1, 500);
      state.camera.position.set(6, 5, 6);

      const hemi = new THREE.HemisphereLight(0xbdd6ff, 0x1d2838, 1.0);
      const dir = new THREE.DirectionalLight(0xffffff, 1.1);
      dir.position.set(6, 8, 4);
      state.scene.add(hemi, dir);

      const grid = new THREE.GridHelper(40, 40, 0x4b75b0, 0x2a3b5a);
      grid.position.y = 0;
      state.scene.add(grid);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.MeshStandardMaterial({ color: 0x0b1322, roughness: 1, metalness: 0 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.001;
      floor.userData.isFloor = true;
      floor.name = 'Suelo';
      state.scene.add(floor);

      state.orbit = new OrbitControls(state.camera, state.renderer.domElement);
      state.orbit.enableDamping = true;
      state.orbit.dampingFactor = 0.08;
      state.orbit.target.set(0, 1, 0);
      state.orbit.maxPolarAngle = Math.PI / 2 - 0.03;

      state.transform = new TransformControls(state.camera, state.renderer.domElement);
      state.transform.setSize(0.85);
      state.transform.addEventListener('dragging-changed', ev => {
        state.orbit.enabled = !ev.value;
      });
      state.transform.addEventListener('objectChange', () => {
        syncInspector();
        refreshHierarchy();
      });
      state.scene.add(state.transform);

      bindUI();
      addObject('box');
      animate();
    }

    // ===== Módulo: Objetos =====
    function makeGeometry(type) {
      if (type === 'sphere') return new THREE.SphereGeometry(0.65, 20, 16);
      if (type === 'cylinder') return new THREE.CylinderGeometry(0.5, 0.5, 1.2, 18);
      if (type === 'plane') return new THREE.PlaneGeometry(1.3, 1.3);
      return new THREE.BoxGeometry(1, 1, 1);
    }

    function addObject(type) {
      const geom = makeGeometry(type);
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.62, 0.55) });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.set((Math.random() - 0.5) * 2.4, type === 'plane' ? 0.01 : 0.7, (Math.random() - 0.5) * 2.4);
      if (type === 'plane') mesh.rotation.x = -Math.PI / 2;

      mesh.userData.kind = type;
      mesh.userData.uuid = crypto.randomUUID ? crypto.randomUUID() : `obj-${Date.now()}-${Math.random()}`;
      mesh.name = `${nameFromType(type)}_${String(state.idCounter++).padStart(2, '0')}`;
      state.scene.add(mesh);
      state.objects.push(mesh);
      selectObject(mesh);
      refreshHierarchy();
    }

    function duplicateSelected() {
      if (!state.selected) return;
      const src = state.selected;
      const clone = new THREE.Mesh(src.geometry.clone(), src.material.clone());
      clone.position.copy(src.position).add(new THREE.Vector3(0.4, 0.1, 0.4));
      clone.rotation.copy(src.rotation);
      clone.scale.copy(src.scale);
      clone.userData.kind = src.userData.kind;
      clone.userData.uuid = crypto.randomUUID ? crypto.randomUUID() : `obj-${Date.now()}-${Math.random()}`;
      clone.name = `${src.name}_copy`;
      state.scene.add(clone);
      state.objects.push(clone);
      selectObject(clone);
      refreshHierarchy();
    }

    function deleteSelected() {
      if (!state.selected) return;
      const idx = state.objects.indexOf(state.selected);
      if (idx >= 0) state.objects.splice(idx, 1);
      state.scene.remove(state.selected);
      state.transform.detach();
      state.selected = null;
      syncInspector();
      refreshHierarchy();
      statusText.textContent = 'Objeto eliminado';
    }

    function nameFromType(type) {
      return ({ box: 'Cubo', sphere: 'Esfera', cylinder: 'Cilindro', plane: 'Plano' })[type] || 'Objeto';
    }

    // ===== Módulo: Selección =====
    function selectObject(obj) {
      state.selected = obj;
      state.transform.attach(obj);
      syncInspector();
      refreshHierarchy();
      statusText.textContent = `Seleccionado: ${obj.name}`;
    }

    function clearSelection() {
      state.selected = null;
      state.transform.detach();
      syncInspector();
      refreshHierarchy();
      statusText.textContent = 'Sin selección';
    }

    function pickFromPointer(clientX, clientY) {
      const rect = state.renderer.domElement.getBoundingClientRect();
      state.pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      state.pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      state.raycaster.setFromCamera(state.pointer, state.camera);
      const hits = state.raycaster.intersectObjects(state.objects, false);
      if (hits.length) selectObject(hits[0].object);
      else clearSelection();
    }

    // ===== Módulo: UI =====
    function bindUI() {
      document.querySelectorAll('[data-create]').forEach(btn => {
        btn.addEventListener('click', () => addObject(btn.dataset.create));
      });

      document.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.transform.setMode(btn.dataset.mode);
        });
      });

      document.getElementById('duplicateBtn').addEventListener('click', duplicateSelected);
      document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
      document.getElementById('saveBtn').addEventListener('click', saveProject);
      document.getElementById('loadBtn').addEventListener('click', loadProject);

      state.renderer.domElement.addEventListener('pointerdown', (ev) => {
        // Evita conflicto al usar el gizmo
        if (state.transform.dragging) return;
        pickFromPointer(ev.clientX, ev.clientY);
      });

      window.addEventListener('resize', onResize);

      const leftPanel = document.getElementById('hierarchyPanel');
      const rightPanel = document.getElementById('inspectorPanel');
      document.getElementById('toggleHierarchy').addEventListener('click', () => leftPanel.classList.toggle('open'));
      document.getElementById('toggleInspector').addEventListener('click', () => rightPanel.classList.toggle('open'));

      bindInspectorInputs();
    }

    function bindInspectorInputs() {
      const ids = ['nameInput', 'posX', 'posY', 'posZ', 'rotX', 'rotY', 'rotZ', 'sclX', 'sclY', 'sclZ', 'colorInput'];
      ids.forEach(id => document.getElementById(id).addEventListener('input', applyInspector));
    }

    function applyInspector() {
      const o = state.selected;
      if (!o) return;

      o.name = document.getElementById('nameInput').value || o.name;
      o.position.set(toNum('posX'), toNum('posY'), toNum('posZ'));
      o.rotation.set(
        THREE.MathUtils.degToRad(toNum('rotX')),
        THREE.MathUtils.degToRad(toNum('rotY')),
        THREE.MathUtils.degToRad(toNum('rotZ'))
      );
      o.scale.set(Math.max(0.1, toNum('sclX')), Math.max(0.1, toNum('sclY')), Math.max(0.1, toNum('sclZ')));
      o.material.color.set(document.getElementById('colorInput').value);

      refreshHierarchy();
    }

    function syncInspector() {
      const o = state.selected;
      const disabled = !o;
      ['nameInput','posX','posY','posZ','rotX','rotY','rotZ','sclX','sclY','sclZ','colorInput'].forEach(id => {
        document.getElementById(id).disabled = disabled;
      });
      if (!o) return;

      document.getElementById('nameInput').value = o.name;
      document.getElementById('posX').value = o.position.x.toFixed(2);
      document.getElementById('posY').value = o.position.y.toFixed(2);
      document.getElementById('posZ').value = o.position.z.toFixed(2);
      document.getElementById('rotX').value = THREE.MathUtils.radToDeg(o.rotation.x).toFixed(1);
      document.getElementById('rotY').value = THREE.MathUtils.radToDeg(o.rotation.y).toFixed(1);
      document.getElementById('rotZ').value = THREE.MathUtils.radToDeg(o.rotation.z).toFixed(1);
      document.getElementById('sclX').value = o.scale.x.toFixed(2);
      document.getElementById('sclY').value = o.scale.y.toFixed(2);
      document.getElementById('sclZ').value = o.scale.z.toFixed(2);
      document.getElementById('colorInput').value = `#${o.material.color.getHexString()}`;
    }

    function refreshHierarchy() {
      hierarchyList.innerHTML = '';
      for (const o of state.objects) {
        const btn = document.createElement('button');
        btn.className = `btn obj-item${o === state.selected ? ' sel' : ''}`;
        btn.textContent = `${iconFromType(o.userData.kind)} ${o.name}`;
        btn.onclick = () => selectObject(o);
        hierarchyList.appendChild(btn);
      }
    }

    function iconFromType(type) {
      return ({ box: '🧊', sphere: '🔵', cylinder: '🥫', plane: '▭' })[type] || '⬚';
    }

    // ===== Módulo: Persistencia =====
    function saveProject() {
      const data = state.objects.map(o => ({
        kind: o.userData.kind,
        name: o.name,
        position: o.position.toArray(),
        rotation: [o.rotation.x, o.rotation.y, o.rotation.z],
        scale: o.scale.toArray(),
        color: `#${o.material.color.getHexString()}`
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, data }));
      statusText.textContent = 'Proyecto guardado en localStorage';
    }

    function loadProject() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        statusText.textContent = 'No hay proyecto guardado';
        return;
      }
      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch {
        statusText.textContent = 'Guardado inválido';
        return;
      }

      for (const o of [...state.objects]) {
        state.scene.remove(o);
      }
      state.objects.length = 0;
      state.transform.detach();
      state.selected = null;

      for (const item of parsed.data || []) {
        const geom = makeGeometry(item.kind);
        const mat = new THREE.MeshStandardMaterial({ color: item.color || '#4ea4ff' });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.name = item.name || 'Objeto';
        mesh.userData.kind = item.kind || 'box';
        mesh.position.fromArray(item.position || [0, 0.5, 0]);
        mesh.rotation.set(...(item.rotation || [0, 0, 0]));
        mesh.scale.fromArray(item.scale || [1, 1, 1]);
        state.scene.add(mesh);
        state.objects.push(mesh);
      }

      refreshHierarchy();
      syncInspector();
      statusText.textContent = 'Proyecto cargado';
    }

    // ===== Utilidades =====
    function onResize() {
      if (!state.renderer || !state.camera) return;
      state.camera.aspect = sceneWrap.clientWidth / sceneWrap.clientHeight;
      state.camera.updateProjectionMatrix();
      state.renderer.setSize(sceneWrap.clientWidth, sceneWrap.clientHeight);
    }

    function toNum(id) {
      const n = parseFloat(document.getElementById(id).value);
      return Number.isFinite(n) ? n : 0;
    }

    function animate() {
      requestAnimationFrame(animate);
      state.orbit.update();
      state.renderer.render(state.scene, state.camera);
    }

    init();
  </script>
</body>
</html>
