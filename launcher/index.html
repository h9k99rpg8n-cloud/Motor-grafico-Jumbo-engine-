<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2b2b2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Jumbo Engine Launcher</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/jumbo-icon.svg" />
  <link rel="stylesheet" href="./css/launcher.css" />
  <link rel="stylesheet" href="./css/dialogs.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img" focusable="false">
            <path fill="#478cbf" d="M8 20h32l16 12-16 12H8z" />
            <circle cx="22" cy="32" r="6" fill="#fff" />
          </svg>
        </div>
        <div>
          <h1>Jumbo Engine</h1>
          <p class="version">Launcher v1.0 · Motor 0.9.2</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn primary" id="new-project-btn">
          <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          Nuevo Proyecto
        </button>
        <button class="btn" id="import-project-btn">
          <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 15v4h14v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          Importar Proyecto
        </button>
        <button class="btn" id="templates-btn">
          <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3 9h18" stroke="currentColor" stroke-width="2"/></svg>
          </span>
          Plantillas de Proyecto
        </button>
      </div>
    </header>

    <section class="panel" aria-labelledby="recientes">
      <div class="panel-header">
        <h2 id="recientes">Proyectos recientes</h2>
        <button class="btn subtle" id="open-manager-btn">Ver gestor</button>
      </div>
      <div class="recent-list" id="recent-projects"></div>
    </section>

    <section class="panel" id="project-manager">
      <div class="panel-header">
        <h2>Gestor de proyectos</h2>
        <div class="panel-actions">
          <button class="btn subtle" id="refresh-projects">Actualizar</button>
          <button class="btn subtle" id="toggle-layout">Vista lista</button>
        </div>
      </div>
      <div class="project-grid" id="projects-grid"></div>
    </section>

    <section class="panel info-panel">
      <div>
        <h3>Persistencia offline</h3>
        <p>Todos los proyectos se guardan en IndexedDB y la lista rápida en localStorage para acceso sin conexión.</p>
      </div>
      <button class="btn primary" id="install-btn">
        <span class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 15v4h14v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        Agregar a pantalla de inicio
      </button>
      <p class="install-hint" id="install-hint"></p>
    </section>
  </div>

  <input type="file" id="import-file" accept="application/json" hidden />

  <div class="modal" id="new-project-modal" aria-hidden="true" role="dialog" aria-labelledby="nuevo-proyecto">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="nuevo-proyecto">Nuevo proyecto</h2>
        <button class="icon-btn" data-close="new-project-modal" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label>
          Nombre del proyecto
          <input type="text" id="project-name" placeholder="Mi proyecto" />
        </label>
        <label>
          Ruta / ubicación
          <input type="text" id="project-location" placeholder="/Proyectos" />
        </label>
        <div class="field-group">
          <p>Plantilla</p>
          <div class="radio-grid" id="template-options"></div>
        </div>
        <div class="field-group">
          <p>Renderer</p>
          <div class="radio-grid" id="renderer-options"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close="new-project-modal">Cancelar</button>
        <button class="btn primary" id="create-project-btn">Crear y Editar</button>
      </div>
    </div>
  </div>

  <div class="modal" id="templates-modal" aria-hidden="true" role="dialog" aria-labelledby="plantillas">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="plantillas">Plantillas de proyecto</h2>
        <button class="icon-btn" data-close="templates-modal" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body" id="templates-list"></div>
      <div class="modal-footer">
        <button class="btn" data-close="templates-modal">Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/launcher.js"></script>
</body>
</html>
